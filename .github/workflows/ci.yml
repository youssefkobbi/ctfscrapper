name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic-dev libyara-dev clamav libclamav-dev
          # Stop clamav-daemon if it starts automatically (prevents hanging in CI)
          timeout 10 sudo systemctl stop clamav-daemon 2>/dev/null || true
          timeout 10 sudo systemctl disable clamav-daemon 2>/dev/null || true
          # Verify clamav-daemon is not running
          sudo systemctl is-active --quiet clamav-daemon && timeout 10 sudo systemctl stop clamav-daemon || true
          # Ensure clamav-daemon is not running
          sudo systemctl is-active --quiet clamav-daemon && sudo systemctl stop clamav-daemon || true
          # Verify installation
          dpkg -l | grep -E "(libmagic|libyara|clamav|libclamav)" || true
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Install optional malware detection dependencies
        run: |
          pip install yara-python clamd || echo "Warning: Optional malware detection dependencies failed to install, continuing without them"
        continue-on-error: true
      
      - name: Run linting
        run: |
          flake8 ctfscrapper/ --max-line-length=100
          black --check ctfscrapper/
      
      - name: Run type checking (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: |
          mypy ctfscrapper/ --ignore-missing-imports
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=ctfscrapper --cov-report=xml --cov-fail-under=0

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine
      
      - name: Build package
        run: |
          python -m build
      
      - name: Verify package
        run: |
          twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1